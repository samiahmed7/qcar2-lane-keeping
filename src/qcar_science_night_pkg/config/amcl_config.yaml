amcl:
  ros__parameters:
    use_sim_time: false

    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"

    scan_topic: "/scan"
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_min_range: 0.05
    laser_max_range: 5.0
    max_beams: 60

    z_hit: 0.7
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.2
    sigma_hit: 0.2
    lambda_short: 0.1

    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    min_particles: 1000
    max_particles: 3000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1

    update_min_d: 0.05
    update_min_a: 0.05

    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9

    tf_broadcast: true
    transform_tolerance: 0.2

    save_pose_rate: 0.5

    set_initial_pose: false
    always_reset_initial_pose: false

    initial_pose:
      x: 0.00073714
      y: 0.0021159
      z: 0.0
      yaw: -0.31886036

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "/home/nvidia/ros2_ws_izhan/track_map_new.yaml"

lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - map_server
      - amcl
