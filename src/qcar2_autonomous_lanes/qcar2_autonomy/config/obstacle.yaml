lidar_obstacle_node:
  ros__parameters:
    use_sim_time: true
    scan_topic: /qcar2/lidar/scan
    lane_model_topic: /qcar2/lane/model
    behavior_state_topic: /qcar2/behavior/state
    obstacle_state_topic: /qcar2/obstacle/state
    front_angle_deg: 25.0
    side_angle_min_deg: 35.0
    side_angle_max_deg: 110.0
    front_stop_distance: 2.8
    side_clear_distance: 0.60
    publish_rate: 10.0
    lane_width_m: 0.75
    corridor_width_m: 0.75
    corridor_start_m: 0.10
    corridor_length_m: 3.5
    corridor_samples: 18
    lane_clear_distance: 3.0
    min_points_to_block: 2
    scan_timeout_sec: 0.8
    max_abs_curvature: 1.2
